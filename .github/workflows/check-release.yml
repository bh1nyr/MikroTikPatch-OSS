name: Check for new RouterOS releases

# Checks the selected RouterOS channel and builds new versions as Actions
# artifacts. Manual runs always build; no GitHub releases are created.

on:
  schedule:
    # hourly, at :17 (GitHub delays jobs scheduled on the hour)
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: RouterOS version to patch (leave empty for the latest on the channel)
        required: false
        default: ""
        type: string
      channel:
        description: RouterOS release channel to check
        required: true
        default: stable
        type: choice
        options:
          - long-term
          - stable
          - testing
          - development
      boot_test:
        description: Boot every built image in QEMU and check the licence
        required: true
        default: true
        type: boolean
      legacy_bios:
        description: Also build the x86 legacy-BIOS image
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

# A scheduled and a manual run must not patch the same version at once.
concurrency:
  group: routeros-release-check
  cancel-in-progress: false

jobs:
  check:
    name: Resolve the version to build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve the target version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel || vars.ROUTEROS_CHANNEL || 'stable' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          channel="$CHANNEL"
          case "$channel" in
            long-term|stable|testing|development) ;;
            *) echo "::error::unknown release channel '$channel'"; exit 1 ;;
          esac

          manual=false
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && manual=true

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            echo "checking the latest RouterOS version on the $channel channel"
            body=$(curl -fsS --retry 3 --max-time 60 "https://upgrade.mikrotik.com/routeros/NEWESTa7.$channel")
            version=$(printf '%s\n' "$body" | awk 'NR == 1 { print $1 }')
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([a-z]+[0-9]+)?$ ]]; then
            echo "::error::invalid RouterOS version '$version'"
            exit 1
          fi
          echo "target version: $version (channel $channel)"

          # A successful build artifact replaces releases as the build marker.
          # Match the branch and commit so updated code can rebuild a version.
          built=false
          if [ "$manual" = false ]; then
            run_ids=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/artifacts?name=routeros-$version&per_page=100" \
              --jq ".artifacts[] | select(.expired == false) | select(.workflow_run.head_branch == \"$GITHUB_REF_NAME\") | select(.workflow_run.head_sha == \"$GITHUB_SHA\") | .workflow_run.id")
            for run_id in $run_ids; do
              run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
              if printf '%s\n' "$run" | jq -e \
                '(.conclusion == "success") and ((.path == ".github/workflows/check-release.yml") or (.path == ".github/workflows/build-release.yml"))' >/dev/null; then
                built=true
                break
              fi
            done
          fi

          build=true
          if [ "$built" = true ]; then
            echo "RouterOS $version already has a successful build for this commit"
            build=false
          fi

          {
            echo "### RouterOS build check"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| channel | $channel |"
            echo "| target version | $version |"
            echo "| built already for this commit | $built |"
            echo "| build | $build |"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "version=$version"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build RouterOS ${{ needs.check.outputs.version }}
    if: ${{ needs.check.outputs.build == 'true' }}
    needs: check
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.check.outputs.version }}
      boot_test: ${{ github.event_name == 'schedule' || inputs.boot_test }}
      legacy_bios: ${{ github.event_name == 'schedule' || inputs.legacy_bios }}
    secrets: inherit
